# Bahçeden API: temel yapılandırma.
#
# Secret ve bağlantı bilgisi burada YOKTUR; yalnızca ortam değişkeni referansı
# vardır (AGENTS.md K10). Değişken tanımsızsa uygulama açılışta hata verir:
# yanlış yapılandırma çalışma zamanında değil ayağa kalkarken görünür.
# Değişkenlerin anlamı ve örnek değerleri: api/.env.example

spring:
  application:
    name: bahceden-api

  datasource:
    url: ${BAHCEDEN_DB_URL}
    username: ${BAHCEDEN_DB_USERNAME}
    password: ${BAHCEDEN_DB_PASSWORD}

  jpa:
    hibernate:
      # Şema yalnızca Liquibase ile değişir; entity ile şema uyuşmazsa uygulama
      # ayağa kalkmaz (ADR-016). update / create-drop yasaktır.
      ddl-auto: validate
    # İstek bitince oturum kapanır: view katmanında lazy yükleme sürprizi olmaz.
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  mail:
    # SMTP sağlayıcıdan bağımsızdır (ADR-017): geliştirmede mailpit, üretimde
    # gerçek sunucu. Kimlik bilgileri yalnızca ortamdan gelir (K10).
    host: ${BAHCEDEN_SMTP_HOST}
    port: ${BAHCEDEN_SMTP_PORT}
    username: ${BAHCEDEN_SMTP_USERNAME:}
    password: ${BAHCEDEN_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${BAHCEDEN_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${BAHCEDEN_SMTP_STARTTLS:false}
      # Gönderim kullanıcıyı bekletmemeli: hata zaten akışı kesmiyor.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      # Belge sınırı (bahceden.storage.max-document-bytes, 10 MB) ile aynı
      # tutulur; sınırı aşan dosya belleğe alınmadan reddedilir (ADR-039).
      # İstek sınırı form alanları için küçük bir pay bırakır.
      max-file-size: 10MB
      max-request-size: 11MB

  messages:
    # Kullanıcıya dönen metinler (ADR-031): messages.properties Türkçe ve
    # temeldir. Sunucunun işletim sistemi dili sonucu ETKİLEMEZ: İngilizce bir
    # sunucuda desteklenmeyen dil yine Türkçeye düşer.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Bağlam AÇIKÇA bildirilir. Liquibase, çalışma anında hiç bağlam
    # verilmezse bağlam etiketli changeset'leri de uygular; yani
    # "contextFilter:dev" tek başına koruma sağlamaz. Taban bağlam `default`
    # olduğu için dev seed'i burada uygulanmaz (ADR-016).
    contexts: default

server:
  port: 8080
  # Hız sınırı istemci adresine dayanır (design.md D5). web BFF arkasında tüm
  # istekler web konteynerinden gelir; gerçek adres X-Forwarded-For'dadır.
  # Tomcat bu başlığa yalnızca iç ağdaki (özel IP aralığı) proxy'den gelirse
  # güvenir, dışarıdan gönderilen sahte başlık adresi değiştiremez.
  forward-headers-strategy: native
  error:
    # Hata gövdesi tek yerden üretilir (GlobalExceptionHandler, AGENTS.md §11.5):
    # Spring'in varsayılan gövdesi iç detay sızdırabilir.
    include-message: never
    include-stacktrace: never
    include-exception: false

springdoc:
  # Sözleşme bu uçtan üretilir (ADR-009). Swagger UI paketi alınmadığı için
  # yalnızca spec uçları vardır.
  api-docs:
    path: /v3/api-docs

bahceden:
  web-origin: ${BAHCEDEN_WEB_ORIGIN}
  mail-from: ${BAHCEDEN_MAIL_FROM}
  jwt:
    # Erişim token'ı imza anahtarı (ADR-008): Base64, en az 256 bit. Varsayılan
    # YOKTUR; eksik, kısa veya Base64 olmayan değerle uygulama açılmaz (K10).
    secret: ${BAHCEDEN_JWT_SECRET}
  storage:
    # Yüklenen dosyaların dizini (ADR-039): uygulama kökünün dışında, geliştirmede
    # Docker volume'u. Varsayılan YOKTUR; dizin yazılamıyorsa uygulama açılmaz.
    dir: ${BAHCEDEN_STORAGE_DIR}
    # Başvuru belgesinin üst sınırı: 10 MB (yukarıdaki multipart sınırıyla aynı).
    max-document-bytes: 10485760

logging:
  level:
    com.bahceden: INFO
