# Bahçeden API: temel yapılandırma.
#
# Secret ve bağlantı bilgisi burada YOKTUR; yalnızca ortam değişkeni referansı
# vardır (AGENTS.md K10). Değişken tanımsızsa uygulama açılışta hata verir:
# yanlış yapılandırma çalışma zamanında değil ayağa kalkarken görünür.
# Değişkenlerin anlamı ve örnek değerleri: api/.env.example

spring:
  application:
    name: bahceden-api

  datasource:
    url: ${BAHCEDEN_DB_URL}
    username: ${BAHCEDEN_DB_USERNAME}
    password: ${BAHCEDEN_DB_PASSWORD}

  jpa:
    hibernate:
      # Şema yalnızca Liquibase ile değişir; entity ile şema uyuşmazsa uygulama
      # ayağa kalkmaz (ADR-016). update / create-drop yasaktır.
      ddl-auto: validate
    # İstek bitince oturum kapanır: view katmanında lazy yükleme sürprizi olmaz.
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  mail:
    # SMTP sağlayıcıdan bağımsızdır (ADR-017): geliştirmede mailpit, üretimde
    # gerçek sunucu. Kimlik bilgileri yalnızca ortamdan gelir (K10).
    host: ${BAHCEDEN_SMTP_HOST}
    port: ${BAHCEDEN_SMTP_PORT}
    username: ${BAHCEDEN_SMTP_USERNAME:}
    password: ${BAHCEDEN_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${BAHCEDEN_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${BAHCEDEN_SMTP_STARTTLS:false}
      # Gönderim kullanıcıyı bekletmemeli: hata zaten akışı kesmiyor.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  servlet:
    multipart:
      # Belge sınırı (bahceden.storage.max-document-bytes, 10 MB) ile aynı
      # tutulur; sınırı aşan dosya belleğe alınmadan reddedilir (ADR-039).
      # İstek sınırı en kalabalık yüklemeye göredir: ayıplı ürün talebinde 3
      # fotoğraf (ADR-081) ve form alanları için küçük bir pay.
      max-file-size: 10MB
      max-request-size: 31MB

  messages:
    # Kullanıcıya dönen metinler (ADR-031): messages.properties Türkçe ve
    # temeldir. Sunucunun işletim sistemi dili sonucu ETKİLEMEZ: İngilizce bir
    # sunucuda desteklenmeyen dil yine Türkçeye düşer.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Bağlam AÇIKÇA bildirilir. Liquibase, çalışma anında hiç bağlam
    # verilmezse bağlam etiketli changeset'leri de uygular; yani
    # "contextFilter:dev" tek başına koruma sağlamaz. Taban bağlam `default`
    # olduğu için dev seed'i burada uygulanmaz (ADR-016).
    contexts: default

server:
  port: 8080
  # Hız sınırı istemci adresine dayanır (design.md D5). web BFF arkasında tüm
  # istekler web konteynerinden gelir; gerçek adres X-Forwarded-For'dadır.
  # Tomcat bu başlığa yalnızca iç ağdaki (özel IP aralığı) proxy'den gelirse
  # güvenir, dışarıdan gönderilen sahte başlık adresi değiştiremez.
  forward-headers-strategy: native
  error:
    # Hata gövdesi tek yerden üretilir (GlobalExceptionHandler, AGENTS.md §11.5):
    # Spring'in varsayılan gövdesi iç detay sızdırabilir.
    include-message: never
    include-stacktrace: never
    include-exception: false

springdoc:
  # Sözleşme bu uçtan üretilir (ADR-009). Swagger UI paketi alınmadığı için
  # yalnızca spec uçları vardır.
  api-docs:
    path: /v3/api-docs

bahceden:
  web-origin: ${BAHCEDEN_WEB_ORIGIN}
  mail-from: ${BAHCEDEN_MAIL_FROM}
  jwt:
    # Erişim token'ı imza anahtarı (ADR-008): Base64, en az 256 bit. Varsayılan
    # YOKTUR; eksik, kısa veya Base64 olmayan değerle uygulama açılmaz (K10).
    secret: ${BAHCEDEN_JWT_SECRET}
  storage:
    # Yüklenen dosyaların dizini (ADR-039): uygulama kökünün dışında, geliştirmede
    # Docker volume'u. Varsayılan YOKTUR; dizin yazılamıyorsa uygulama açılmaz.
    dir: ${BAHCEDEN_STORAGE_DIR}
    # Başvuru belgesinin üst sınırı: 10 MB (yukarıdaki multipart sınırıyla aynı).
    max-document-bytes: 10485760
    # İlan fotoğrafının üst sınırı: 10 MB. Orijinal saklanmaz; iki küçük JPEG üretilir (add-product-listings D4).
    max-photo-bytes: 10485760
  payment:
    # Ödeme sağlayıcısı (ADR-054). Gerçek sağlayıcı seçilene kadar (KALANLAR A1)
    # tek değer `fake`: gerçek ağ çağrısı yapmaz, her ödemeyi onaylar.
    provider: fake
  commerce:
    # Komisyon: ürün tutarının %5'i + satıcı siparişi başına 3 TL (ADR-055).
    commission-rate-bp: 500
    commission-fixed-minor: 300
    # Kargo: satıcı başına 99 TL; satıcının ürün tutarı 1000 TL ve üzeriyse ücretsiz (ADR-058).
    shipping-fee-minor: 9900
    free-shipping-threshold-minor: 100000
    # Ödeme bu süre içinde tamamlanmazsa sipariş düşer (add-cart-and-checkout D8).
    payment-timeout: PT30M
    # Teslimat yapılan iller, plaka koduyla: İstanbul, İzmir, Ankara, Manisa (KALANLAR A4, D5).
    delivery-provinces: ["34", "35", "06", "45"]
  claims:
    # Ayıplı ürün talebi (ADR-056 §4, ADR-081): teslimden itibaren 48 saat
    # içinde açılır; satıcının yanıt süresi 48 saattir, geçerse talep yönetime düşer.
    # Satıcı kısmi teklif verir ya da reddederse alıcının 48 saati vardır; yanıt
    # vermezse teklif kabul edilmiş, ret kesinleşmiş sayılır (ADR-083).
    window: PT48H
    seller-response: PT48H
    buyer-response: PT48H
    # Süresi dolan talepleri ilerleten iş (ADR-083): satıcı sessizse yönetime
    # düşer, alıcı sessizse teklif uygulanır ya da ret kesinleşir.
    sweep-enabled: true
    sweep-interval: PT5M
    # Sayfa boyutu: bir tur süresi dolmuş bütün talepleri bu boyutta sayfalarla
    # dolaşır; hata veren talep arkadakileri bekletmez (ADR-100).
    sweep-batch-size: 100
  cleanup:
    # Temizlik işleri (add-stale-record-cleanup): ödeme dönüşü hiç gelmeyen siparişler
    # sağlayıcıdan doğrulanıp kapatılır (D1); süresi geçmiş token satırları silinir (D2).
    enabled: true
    interval: PT10M
    # Ödeme süresi dolduktan sonra işin beklediği süre: alıcının dönüşü önceliklidir ve
    # sağlayıcıda geç tamamlanan ödeme de görülüp iade edilir.
    pending-payment-grace: PT1H
    # Sayfa boyutu: bir tur bütün süresi dolmuş siparişleri dolaşır (ADR-100).
    pending-payment-batch-size: 100
    # Süresi dolmuş token satırı bu kadar sonra silinir (destek için kısa iz).
    token-retention: P7D
  shipping:
    # Kargo entegratörü (ADR-057). Gerçek entegratör seçilene kadar (KALANLAR A2)
    # tek değer `fake`: ağ çağrısı yapmaz, gönderiyi zamanla ilerletir.
    integrator: fake
    # Açık gönderilerin durumu bu aralıkla entegratörden sorgulanır (add-shipments D5).
    polling-enabled: true
    poll-interval: PT5M
    poll-batch-size: 100
    # Koli boyutunun desi karşılığı; yalnızca entegratöre bildirilir, ücreti etkilemez (D3).
    package-desi:
      small: 5
      medium: 15
      large: 30
    # Sahte entegratörün ilerletme süreleri, gönderinin açılışından itibaren.
    fake:
      handed-over-after: PT6H
      in-transit-after: PT12H
      delivered-after: PT36H

logging:
  level:
    com.bahceden: INFO
