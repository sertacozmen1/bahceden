# User-facing texts: English.
#
# Keys are identical to messages.properties (Turkish, base); the key sets are
# kept equal by MessagesCatalogTest (ADR-031).
#
# Messages with arguments ({0}) follow java.text.MessageFormat: an apostrophe
# is written as ''. Messages without arguments are returned verbatim.

# ── Validation (Bean Validation) ──────────────────────────────
validation.email.required=Email address is required
validation.email.format=Enter a valid email address
validation.email.max=Email address can be at most 320 characters
validation.password.required=Password is required
validation.password.max=Password can be at most 200 characters
validation.password.length=Password must be between 10 and 200 characters
validation.code.required=Code is required
validation.code.format=Code must be six digits
validation.refreshToken.required=Refresh token is required
validation.refreshToken.max=Refresh token can be at most 200 characters
validation.verificationToken.required=Verification token is required
validation.verificationToken.max=Verification token can be at most 200 characters
validation.passwordResetToken.required=Reset token is required
validation.passwordResetToken.max=Reset token can be at most 200 characters
validation.page.min=Page number cannot be negative
validation.pageSize.min=Page size must be at least 1

# ── Errors ────────────────────────────────────────────────────
error.validation=Some of the submitted values are invalid.
error.typeMismatch=The value is not of the expected type.
error.internal=Something went wrong. Please try again.
error.authRequired=You need to sign in to do this.
error.rateLimited=Too many attempts. Please try again in a little while.
error.invalidCredentials=The email address or password is incorrect.
error.invalidCode=The code is incorrect or has expired. If needed, sign in again to get a new code.
error.tooManyCodeAttempts=Too many incorrect codes were entered. Sign in again to get a new code.
error.sessionExpired=Your session has expired. Please sign in again.
error.sessionInvalid=Your session is no longer valid. Please sign in again.
error.verificationTokenInvalid=This verification link is invalid, has already been used or has expired. You can request a new link after signing in.
error.passwordResetTokenInvalid=This password reset link is invalid, has already been used or has expired. You can request a new link.

# ── Information ───────────────────────────────────────────────
info.registrationAccepted=We sent a link to your email address. You can sign in to your account right away.
info.loginChallengeIssued=We sent a sign-in code to your email address.
info.passwordResetRequested=If an account is registered with this address, we sent a password reset link. The link is valid for 1 hour.

# ── Emails ({0}: link / code) ─────────────────────────────────
mail.verification.subject=Bahçeden: verify your email address
mail.verification.body=Hello,\n\n\
To verify the email address of your Bahçeden account, open the link below:\n\n\
{0}\n\n\
The link is valid for 24 hours and can be used only once.\n\
You can sign in to your account without waiting for verification.\n\n\
If you did not make this request, you can ignore this email.\n

mail.existingAccount.subject=Bahçeden: you already have an account
mail.existingAccount.body=Hello,\n\n\
A Bahçeden account with this email address already exists. No new account was created.\n\n\
To sign in: {0}\n\n\
If you did not make this request, you can ignore this email.\n

mail.loginCode.subject=Bahçeden: your sign-in code
mail.loginCode.body=Hello,\n\n\
Your code for signing in to your Bahçeden account:\n\n\
{0}\n\n\
The code is valid for 10 minutes and can be used only once.\n\
If you did not try to sign in, we recommend changing your password.\n

mail.passwordReset.subject=Bahçeden: reset your password
mail.passwordReset.body=Hello,\n\n\
To set a new password for your Bahçeden account, open the link below:\n\n\
{0}\n\n\
The link is valid for 1 hour and can be used only once. Links sent earlier no longer work.\n\n\
If you did not make this request, you can ignore this email; your password will not change.\n

mail.passwordChanged.subject=Bahçeden: your password was changed
mail.passwordChanged.body=Hello,\n\n\
The password of your Bahçeden account was just changed and your open sessions were signed out.\n\n\
If you did not make this change, set a new password right away: {0}\n
