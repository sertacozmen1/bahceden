# Geliştirme profili.
#
# Tek farkı geliştirme verisidir: seed changeset'i `context:dev` ile işaretli
# ve bu bağlam yalnızca burada etkinleştirilir (ADR-014, ADR-016). Üretim
# profilinde çalışmaz, dolayısıyla üretim verisine sahte kayıt girmez.

spring:
  liquibase:
    # Taban bağlama dev eklenir: şema değişiklikleri (bağlamsız) ve dev seed'i
    # birlikte uygulanır.
    contexts: default,dev

bahceden:
  shipping:
    # Geliştirmede gönderi birkaç dakikada teslim edilir: akış elle izlenebilir.
    poll-interval: PT1M
    fake:
      handed-over-after: PT2M
      in-transit-after: PT4M
      delivered-after: PT6M
  cleanup:
    # Temizlik işleri dakikada bir döner: ödenmemiş siparişin kapanması elle izlenebilir.
    interval: PT1M

logging:
  level:
    com.bahceden: DEBUG
