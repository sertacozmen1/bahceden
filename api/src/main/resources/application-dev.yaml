# Geliştirme profili.
#
# Tek farkı geliştirme verisidir: seed changeset'i `context:dev` ile işaretli
# ve bu bağlam yalnızca burada etkinleştirilir (ADR-014, ADR-016). Üretim
# profilinde çalışmaz, dolayısıyla üretim verisine sahte kayıt girmez.

spring:
  liquibase:
    # Taban bağlama dev eklenir: şema değişiklikleri (bağlamsız) ve dev seed'i
    # birlikte uygulanır.
    contexts: default,dev

logging:
  level:
    com.bahceden: DEBUG
