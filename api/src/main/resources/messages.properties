mail.sellerApproved.body=Merhaba,\n\n\
"{0}" adıyla yaptığınız satıcı başvurusu onaylandı. Satıcı rolü hesabınıza eklendi.\n\n\
Kaydınızı görmek için: {1}\n

mail.sellerRejected.subject=Bahçeden: satıcı başvurunuz hakkında
