# ── E-postalar ({0}: bağlantı / kod) ──────────────────────────
mail.verification.subject=Bahçeden: e-posta adresinizi doğrulayın
mail.verification.body=Merhaba,\n\n\
Bahçeden hesabınızın e-posta adresini doğrulamak için aşağıdaki bağlantıyı açın:\n\n\
{0}\n\n\
Bağlantı 24 saat geçerlidir ve yalnızca bir kez kullanılabilir.\n\
Hesabınızla doğrulamayı beklemeden giriş yapabilirsiniz.\n\n\
Bu isteği siz yapmadıysanız bu e-postayı yok sayabilirsiniz.\n

mail.existingAccount.subject=Bahçeden: hesabınız zaten var
mail.existingAccount.body=Merhaba,\n\n\
Bu e-posta adresiyle bir Bahçeden hesabı zaten var. Yeni bir hesap açılmadı.\n\n\
Giriş yapmak için: {0}\n\n\
Bu isteği siz yapmadıysanız bu e-postayı yok sayabilirsiniz.\n

mail.loginCode.subject=Bahçeden: giriş kodunuz
mail.loginCode.body=Merhaba,\n\n\
Bahçeden hesabınıza giriş için kodunuz:\n\n\
{0}\n\n\
Kod 10 dakika geçerlidir ve yalnızca bir kez kullanılabilir.\n\
Bu girişi siz yapmadıysanız parolanızı değiştirmenizi öneririz.\n

mail.passwordReset.subject=Bahçeden: parola sıfırlama
mail.passwordReset.body=Merhaba,\n\n\
Bahçeden hesabınız için yeni bir parola belirlemek üzere aşağıdaki bağlantıyı açın:\n\n\
{0}\n\n\
Bağlantı 1 saat geçerlidir ve yalnızca bir kez kullanılabilir. Daha önce gönderilen bağlantılar artık çalışmaz.\n\n\
Bu isteği siz yapmadıysanız bu e-postayı yok sayabilirsiniz; parolanız değişmez.\n

mail.passwordChanged.subject=Bahçeden: parolanız değişti
mail.passwordChanged.body=Merhaba,\n\n\
Bahçeden hesabınızın parolası az önce değiştirildi ve açık oturumlarınız kapatıldı.\n\n\
Bu değişikliği siz yapmadıysanız hemen yeni bir parola belirleyin: {0}\n

# Satıcı kararları ({0}: üretici adı; ret ve askıda {1}: gerekçe, {2}: bağlantı; diğerlerinde {1}: bağlantı)
