"{0}" adıyla yaptığınız satıcı başvurusu şu gerekçeyle reddedildi:\n\n\
{1}\n\n\
Bilgilerinizi düzeltip yeni bir belgeyle yeniden gönderebilirsiniz: {2}\n

mail.sellerSuspended.subject=Bahçeden: satıcı kaydınız askıya alındı
mail.sellerSuspended.body=Merhaba,\n\n\
"{0}" satıcı kaydınız şu gerekçeyle askıya alındı:\n\n\
{1}\n\n\
Askıdayken ürünleriniz vitrinde görünmez. Kaydınızı görmek için: {2}\n

