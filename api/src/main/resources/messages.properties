# ── Hatalar ───────────────────────────────────────────────────
error.validation=Gönderilen değerler geçersiz.
error.typeMismatch=Değer beklenen türde değil.
error.internal=Beklenmeyen bir hata oluştu. Lütfen tekrar deneyin.
error.authRequired=Bu işlem için giriş yapmanız gerekiyor.
error.rateLimited=Çok fazla deneme yaptınız. Lütfen biraz sonra tekrar deneyin.
error.invalidCredentials=E-posta adresi veya parola hatalı.
error.invalidCode=Kod hatalı ya da süresi dolmuş. Gerekirse yeniden giriş yaparak yeni bir kod isteyin.
error.tooManyCodeAttempts=Çok fazla hatalı kod denendi. Yeniden giriş yaparak yeni bir kod isteyin.
error.sessionExpired=Oturumunuzun süresi doldu. Lütfen yeniden giriş yapın.
error.sessionInvalid=Oturumunuz geçersiz. Lütfen yeniden giriş yapın.
error.verificationTokenInvalid=Doğrulama bağlantısı geçersiz, daha önce kullanılmış ya da süresi dolmuş. Giriş yaptıktan sonra yeni bir bağlantı isteyebilirsiniz.
error.passwordResetTokenInvalid=Parola sıfırlama bağlantısı geçersiz, daha önce kullanılmış ya da süresi dolmuş. Yeni bir bağlantı isteyebilirsiniz.

