# Test profili.
#
# Buradaki veritabanı değerleri yalnızca ortam değişkeni YER TUTUCULARININ
# çözülmesi için vardır; gerçek bağlantı Testcontainers tarafından
# @ServiceConnection ile sağlanır ve bu değerleri ezer. Böylece testler
# geliştirici makinesindeki .env dosyasından ve yerel veritabanından bağımsız
# kalır (AGENTS.md §8 test izolasyonu, K10).
#
# Geliştirme seed'i YÜKLENMEZ: dev seed yalnızca `dev` profiline bağlıdır
# (design.md D5). Her test kendi verisini kurar.

spring:
  datasource:
    url: jdbc:postgresql://testcontainers-tarafindan-ezilir/bahceden
    username: test
    password: test
  jpa:
    properties:
      # Sorgu sayısı iddialarını ölçebilmek için (design.md D2).
      hibernate.generate_statistics: true

  mail:
    # Testler gerçek SMTP'ye çıkmaz (K10): MailSender taklit edilir, bu değerler
    # yalnızca yer tutucuların çözülmesi için var.
    host: localhost
    port: 1025

bahceden:
  web-origin: http://localhost:3000
  mail-from: bahceden@ornek.test
  jwt:
    # Yalnızca testler için sabit anahtar; gerçek bir secret değildir.
    secret: YmFoY2VkZW4tdGVzdC1pbXphLWFuYWh0YXJpLXlhbG5pemNhLXRlc3RsZXItaWNpbg==
  storage:
    # Testler gerçek volume'a değil derleme dizinine yazar; `mvn clean` siler.
    dir: target/test-uploads
  shipping:
    # Zamanlayıcı kapalı: testler durum sorgusunu sabit saatle doğrudan çağırır (add-shipments D5).
    polling-enabled: false
  claims:
    # Zamanlayıcı kapalı: testler süre işini sabit saatle doğrudan çağırır (ADR-083).
    sweep-enabled: false
    # Küçük sayfa: bir turun birden fazla sayfayı dolaştığı yol her testte çalışır (ADR-100).
    sweep-batch-size: 2
  cleanup:
    # Zamanlayıcı kapalı: testler temizlik işlerini sabit saatle doğrudan çağırır.
    enabled: false
    pending-payment-batch-size: 2

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
