      operationId: listOwnOrders
      parameters:
      - name: page
        in: query
        description: Sayfa numarası (sıfırdan başlar)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Sayfa boyutu; üst sınır sunucuda 50'ye çekilir
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
        example: 20
      responses:
        "200":
          description: Siparişler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseOrderSummary"
        "400":
          description: Sayfalama değeri geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    post:
      tags:
      - Siparişler
      summary: Sepetten sipariş oluşturur ve ödemeyi başlatır
      description: |
        Sepet satıcılara göre bölünür; fiyat, kargo ücreti ve komisyon bu anda sabitlenir. Stok düşmez.
        Yanıttaki ödeme sayfasına gidilir. Idempotency-Key başlığı zorunludur: aynı anahtarla tekrarlanan
        istek yeni sipariş açmaz, ilk siparişi döner.
      operationId: placeOrder
      parameters:
      - name: Idempotency-Key
        in: header
        description: "Tekrar anahtarı: istemcinin ürettiği 8–64 karakter (harf, rakam,\
          \ tire, alt çizgi)"
        required: true
        schema:
          type: string
        example: c2f1a7e0-5b3d-4c1e-9f2a-7d6b8e9c0a1b
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
        required: true
      responses:
        "201":
          description: Sipariş oluştu; Location başlığı siparişin adresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPlaced"
        "400":
          description: Alan veya Idempotency-Key geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Adres yok veya başkasına ait (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: |-
            Sepet boş (CART_EMPTY), satın alınamayan veya stoğu aşan satır var (CART_HAS_UNAVAILABLE_ITEMS) ya da
            adrese teslimat yok (ADDRESS_NOT_DELIVERABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla sipariş denemesi (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Ödeme sağlayıcısına ulaşılamadı (PAYMENT_PROVIDER_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
