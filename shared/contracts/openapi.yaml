      summary: Oturum sahibinin güncel başvuru belgesini döner
      description: |
        Belge içerikten tespit edilen türüyle, tarayıcının içeriği yorumlamasını ve
        betik çalıştırmasını engelleyen başlıklarla döner.
      operationId: getOwnSellerDocument
      responses:
        "200":
          description: Belge dosyası
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Hesabın satıcı kaydı yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/products:
    get:
      tags:
      - Ürünler
      summary: Vitrinde yayınlanmış ürünleri listeler
      description: |
        Yalnızca yayın durumu PUBLISHED olan ürünleri, yayın tarihine göre
        yeniden eskiye sıralı döner. Sayfa boyutunun üst sınırı sunucuda
        sabittir: daha büyük bir değer istenirse istek reddedilmez, değer
        sınıra çekilir ve yanıt uygulanan boyutu bildirir.
      operationId: listProducts
      parameters:
      - name: page
        in: query
        description: Sayfa numarası (sıfırdan başlar)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Sayfa boyutu; üst sınır sunucuda 50'ye çekilir
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
        example: 20
      responses:
        "200":
          description: Sayfalı ürün listesi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseProductSummary"
        "400":
          description: Sayfalama parametresi geçersiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/products/{slug}:
    get:
      tags:
      - Ürünler
      summary: Vitrindeki ürünün detayını döner
      description: |
        Yalnızca yayında olan ve satıcısı onaylı ürün döner; taslak, arşivlenmiş,
        kaldırılmış ya da satıcısı onaylı olmayan ürün 404 olur. Fotoğraflar sıralıdır.
      operationId: getProduct
      parameters:
