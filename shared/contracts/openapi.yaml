openapi: 3.1.0
info:
  title: Bahçeden API
  description: "Bahçeden, meyve-sebze üreticisini son tüketiciyle doğrudan buluşturan\
    \ çok satıcılı pazaryeridir. Bu sözleşme `api` ile `web` arasındaki tek arayü\
    zdür ve Spring kodundan üretilir; elle düzenlenmez."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Sağlık
  description: Operasyonel sağlık kontrolü
- name: Satıcı ilanları
  description: Onaylı satıcının kendi ürün ilanları
- name: Satıcı başvurusu
  description: Oturum sahibinin satıcı başvurusu ve kaydı
- name: "Admin: ilanlar"
  description: "İlanların listelenmesi, kaldırılması ve yeniden açılması"
- name: "Admin: satıcılar"
  description: Satıcı başvurularının listelenmesi ve karara bağlanması
- name: Ürünler
  description: Vitrindeki ürünlerin listelenmesi
- name: Oturum
  description: "Oturum açma, yenileme ve kapatma"
- name: Hesap
  description: "Hesap açma, e-posta doğrulama, parola sıfırlama ve oturum sahibinin\
    \ kimliği"
paths:
  /api/v1/sellers/me:
    get:
      tags:
      - Satıcı başvurusu
      summary: Oturum sahibinin satıcı kaydını döner
      description: Kayıt yoksa 404 döner; arayüz bunu başvuruya davet olarak gösterir.
      operationId: getOwnSeller
      responses:
        "200":
          description: Satıcı kaydı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSelfView"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Hesabın satıcı kaydı yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    put:
      tags:
      - Satıcı başvurusu
      summary: Reddedilen başvuruyu yeniden gönderir
      description: |
        Yalnızca REJECTED durumundaki kayıt için: beyan güncellenir, yeni belge eklenir ve
        kayıt yeniden PENDING olur. Önceki belge denetim izi için saklanır.
      operationId: resubmitSellerApplication
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SellerApplicationRequest"
      responses:
        "200":
          description: Başvuru yeniden gönderildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSelfView"
        "400":
          description: Alan veya belge geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Hesabın satıcı kaydı yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Kayıt reddedilmiş durumda değil (SELLER_INVALID_TRANSITION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    post:
      tags:
      - Satıcı başvurusu
      summary: Satıcı başvurusu yapar
      description: |
        Beyan alanları ve belge dosyası tek istekte gönderilir. Kayıt PENDING açılır ve
        admin kararı e-postayla bildirilir. E-posta adresi doğrulanmış olmalıdır. Belge
        türü içerikten doğrulanır: PDF, JPEG veya PNG; en çok 10 MB.
      operationId: applyAsSeller
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SellerApplicationRequest"
      responses:
        "201":
          description: Başvuru alındı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSelfView"
        "400":
          description: Alan veya belge geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Hesabın zaten satıcı kaydı var (SELLER_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: E-posta doğrulanmamış (SELLER_EMAIL_NOT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}:
    get:
      tags:
      - Satıcı ilanları
      summary: Satıcının tek ilanını döner
      operationId: getOwnListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    put:
      tags:
      - Satıcı ilanları
      summary: İlanın bilgilerini günceller
      description: Durum ve kalıcı ad değişmez. Yayındaki ilanın değişikliği vitrinde
        hemen görünür.
      operationId: updateListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
        required: true
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}/photos/order:
    put:
      tags:
      - Satıcı ilanları
      summary: Fotoğrafların sırasını değiştirir
      description: Liste ilanın bütün fotoğraflarını eksiksiz ve tekrarsız içermelidir;
        ilk eleman kapak olur.
      operationId: reorderListingPhotos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoOrderRequest"
        required: true
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sessions:
    post:
      tags:
      - Oturum
      summary: Oturum açar
      description: |
        E-posta ve parola ile oturum açar. E-posta doğrulaması girişin koşulu
        değildir. Hesabın ikinci faktörü kapalıysa (varsayılan) token'lar döner;
        açıksa token dönmez ve e-postaya tek kullanımlık bir kod gönderilir.
        Hatalı e-posta ile hatalı parola aynı yanıtı alır.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "202":
          description: İkinci adım bekleniyor; kod e-postayla gönderildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeIssued"
        "400":
          description: İstek gövdesi geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: E-posta veya parola hatalı (AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla deneme (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sessions/refresh:
    post:
      tags:
      - Oturum
      summary: Oturumu yeniler
      description: |
        Yenileme token'ını tüketir; yeni bir erişim token'ı ve yeni bir yenileme
        token'ı döner. Sunulan token bir daha kullanılamaz. Kullanılmış bir token
        yeniden sunulursa oturum zincirinin tamamı iptal edilir.
      operationId: refreshSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Oturum yenilendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          description: "Token eksik (VALIDATION_FAILED) ya da geçersiz, kullanılmı\
            ş, iptal edilmiş veya süresi dolmuş (AUTH_TOKEN_INVALID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sessions/challenge:
    post:
      tags:
      - Oturum
      summary: İkinci faktör koduyla oturum açar
      description: |
        Girişin birinci adımı 202 döndüyse e-postaya gelen altı haneli kod burada
        sunulur. Yalnızca son gönderilen kod geçerlidir; kod 10 dakika geçerlidir
        ve bir kez kullanılabilir. Beş hatalı denemeden sonra girişim kilitlenir.
      operationId: completeLoginChallenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
        required: true
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          description: İstek gövdesi geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Kod hatalı, kullanılmış, süresi dolmuş ya da açık girişim\
            \ yok (AUTH_CODE_INVALID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla hatalı deneme (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sellers/me/products:
    get:
      tags:
      - Satıcı ilanları
      summary: Satıcının ilanlarını listeler
      description: En son güncellenen üstte. Sayfa boyutunun üst sınırı sunucuda 50'dir.
      operationId: listOwnListings
      parameters:
      - name: page
        in: query
        description: Sayfa numarası (sıfırdan başlar)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Sayfa boyutu; üst sınır sunucuda 50'ye çekilir
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
        example: 20
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseSellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    post:
      tags:
      - Satıcı ilanları
      summary: Taslak ilan oluşturur
      description: İlan DRAFT açılır ve vitrinde görünmez; yayına almak için en az
        bir fotoğraf gerekir.
      operationId: createListing
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
        required: true
      responses:
        "201":
          description: İlan oluşturuldu; Location başlığı ilanın adresi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}/unpublish:
    post:
      tags:
      - Satıcı ilanları
      summary: İlanı yayından çeker
      description: PUBLISHED → DRAFT.
      operationId: unpublishListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "409":
          description: Bu durumdan bu geçiş yapılamaz (PRODUCT_INVALID_TRANSITION)
            veya fotoğraf gerekiyor (PRODUCT_PHOTO_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}/restore:
    post:
      tags:
      - Satıcı ilanları
      summary: İlanı arşivden geri alır
      description: ARCHIVED → DRAFT.
      operationId: restoreListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "409":
          description: Bu durumdan bu geçiş yapılamaz (PRODUCT_INVALID_TRANSITION)
            veya fotoğraf gerekiyor (PRODUCT_PHOTO_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}/publish:
    post:
      tags:
      - Satıcı ilanları
      summary: Taslağı yayına alır
      description: DRAFT → PUBLISHED; en az bir fotoğraf gerekir. İlk yayın tarihi
        sonra değişmez.
      operationId: publishListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "409":
          description: Bu durumdan bu geçiş yapılamaz (PRODUCT_INVALID_TRANSITION)
            veya fotoğraf gerekiyor (PRODUCT_PHOTO_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}/photos:
    post:
      tags:
      - Satıcı ilanları
      summary: İlana fotoğraf ekler
      description: |
        Tek dosya, multipart. Fotoğraf sona eklenir; ilan başına en çok 5. Sunucuda EXIF yönü
        uygulanır, iki boyutta JPEG olarak yeniden kodlanır ve meta veri atılır.
      operationId: addListingPhoto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUploadRequest"
      responses:
        "409":
          description: Fotoğraf sınırı doldu (PRODUCT_PHOTO_LIMIT_REACHED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
