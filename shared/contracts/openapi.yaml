              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin rolü yok (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/admin/sellers/{id}:
    get:
      tags:
      - "Admin: satıcılar"
      summary: Satıcı kaydının ayrıntısını ve geçmişini döner
      operationId: getSellerForAdmin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Satıcı kaydı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellerDetail"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin rolü yok (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Kayıt yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/admin/sellers/{id}/document:
    get:
      tags:
      - "Admin: satıcılar"
      summary: Satıcının güncel başvuru belgesini döner
      description: Sahibin belge ucuyla aynı koruma başlıklarıyla döner.
      operationId: getSellerDocumentForAdmin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Belge dosyası
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin rolü yok (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Kayıt veya belge yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/admin/products:
    get:
      tags:
      - "Admin: ilanlar"
      summary: İlanları duruma göre listeler
      description: Varsayılan durum PUBLISHED; en son değişen üstte. Sayfa boyutunun
        üst sınırı sunucuda 50'dir.
      operationId: listProductsForAdmin
      parameters:
      - name: status
        in: query
        description: Durum süzgeci
        required: false
        schema:
          type: string
          default: PUBLISHED
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
          - REMOVED
        example: PUBLISHED
      - name: page
        in: query
        description: Sayfa numarası (sıfırdan başlar)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Sayfa boyutu; üst sınır sunucuda 50'ye çekilir
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
        example: 20
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseAdminProductSummary"
        "400":
          description: Gerekçe veya süzgeç geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Admin rolü yok (AUTH_FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/accounts/me:
    get:
      tags:
      - Hesap
      summary: Oturum sahibinin kimliğini döner
      description: |
        E-posta, roller ve e-posta doğrulama durumu güncel kayıttan okunur; rol
        değişikliği erişim token'ının süresi dolmadan yansır.
      operationId: getCurrentAccount
      responses:
        "200":
          description: Oturum sahibinin kimliği
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "401":
          description: "Erişim token'ı yok, geçersiz ya da süresi dolmuş (AUTH_REQUIRED)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sessions/current:
    delete:
      tags:
      - Oturum
      summary: Oturumu kapatır
      description: |
        Yenileme token'ının ait olduğu oturum zincirinin tamamını iptal eder.
        Erişim token'ı en fazla 15 dakika daha geçerli kalır. Bilinmeyen veya
        zaten iptal edilmiş token için de 204 döner.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "204":
          description: Oturum kapatıldı
        "400":
          description: Token eksik (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sellers/me/products/{id}/photos/{photoId}:
    delete:
      tags:
      - Satıcı ilanları
      summary: İlanın fotoğrafını siler
      description: Kalan fotoğraflar sıkıştırılır. Yayındaki veya kaldırılmış ilanın
        son fotoğrafı silinemez.
      operationId: deleteListingPhoto
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: photoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "409":
          description: Son fotoğraf silinemez (PRODUCT_PHOTO_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
components:
  schemas:
    SellerApplicationRequest:
      type: object
      description: "Satıcı başvurusu: beyan alanları ve belge dosyası"
      properties:
        displayName:
          type: string
          description: Vitrinde görünecek üretici adı
          example: Örnek Bahçe
          maxLength: 160
          minLength: 2
        city:
          type: string
          description: Üreticinin şehri
          example: Manisa
          maxLength: 80
          minLength: 2
        phone:
          type: string
          description: İletişim telefonu; yalnızca admin görür. 0 veya +90 önekiyle
            yazılabilir
          example: +90 555 000 00 00
          maxLength: 20
          minLength: 0
        documentType:
          type: string
          description: Belge türü
          enum:
          - CKS_CERTIFICATE
          - TAX_CERTIFICATE
          example: CKS_CERTIFICATE
          minLength: 1
          pattern: CKS_CERTIFICATE|TAX_CERTIFICATE
        document:
          type: string
          format: binary
          description: "Belge dosyası: PDF, JPEG veya PNG; en çok 10 MB"
      required:
      - city
      - displayName
      - document
      - documentType
      - phone
    ApiError:
      type: object
      description: Hata yanıtı
      properties:
        code:
          type: string
          description: Sabit hata kodu; dilden bağımsızdır
          example: VALIDATION_FAILED
        message:
          type: string
          description: "Kullanıcıya gösterilebilir açıklama; isteğin diliyle (Accept-Language:\
            \ tr, en) döner, varsayılan Türkçe"
          example: Gönderilen değerler geçersiz.
        fieldErrors:
          type: array
          description: Alan bazlı doğrulama hataları
          items:
            $ref: "#/components/schemas/FieldError"
      required:
      - code
      - fieldErrors
      - message
    FieldError:
      type: object
      description: Alan bazlı doğrulama hatası
      properties:
        field:
          type: string
          description: Hatalı alanın adı
          example: size
        message:
          type: string
          description: Alana ait hata açıklaması; isteğin dilinde
          example: Sayfa boyutu en az 1 olmalıdır
      required:
      - field
      - message
    SellerSelfView:
      type: object
      description: Oturum sahibinin satıcı kaydı
      properties:
        slug:
          type: string
          description: Vitrin adresinde kullanılacak kalıcı ad
          example: ornek-bahce
        displayName:
          type: string
          description: Vitrinde görünecek üretici adı
          example: Örnek Bahçe
        city:
          type: string
          description: Şehir
          example: Manisa
        phone:
          type: string
          description: "İletişim telefonu, E.164 biçiminde"
          example: "+905550000000"
        status:
          type: string
          description: Kaydın durumu
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
          example: PENDING
        statusReason:
          type:
          - string
          - "null"
          description: Son ret veya askı gerekçesi; satıcıya gösterilir
          example: Belgedeki ad ile beyan edilen ad eşleşmiyor.
        documentType:
          type: string
          description: Güncel belgenin türü
          enum:
          - CKS_CERTIFICATE
          - TAX_CERTIFICATE
          example: CKS_CERTIFICATE
        statusChangedAt:
          type: string
          format: date-time
          description: "Durumun son değiştiği an (UTC, ISO-8601)"
          example: 2026-10-08T09:30:00Z
      required:
      - city
      - displayName
      - documentType
      - phone
      - slug
      - status
      - statusChangedAt
    ListingRequest:
      type: object
      description: İlan oluşturma veya güncelleme isteği
      properties:
        name:
          type: string
          description: İlan adı
          example: Salkım Domates
          maxLength: 200
          minLength: 2
        description:
          type:
          - string
          - "null"
          description: Açıklama; düz metin
          example: "Tarla domatesi, sabah toplandı."
          maxLength: 2000
          minLength: 0
        unit:
          type: string
          description: Satış birimi
          enum:
          - KILOGRAM
          - PIECE
          - BUNCH
          example: KILOGRAM
          minLength: 1
          pattern: KILOGRAM|PIECE|BUNCH
        priceAmount:
          type: integer
          format: int64
          description: "Birim fiyat, kuruş (2450 = 24,50 TL); para birimi her zaman\
            \ TRY"
          example: 2450
          maximum: 10000000
          minimum: 1
        stockQuantity:
          type: integer
          format: int32
          description: Eldeki miktar; sıfır stokta yok demek
          example: 80
          maximum: 100000
          minimum: 0
      required:
      - name
      - priceAmount
      - stockQuantity
      - unit
    Money:
      type: object
      description: "Para değeri: kuruş cinsinden tamsayı tutar ve para birimi"
      properties:
        amount:
          type: integer
          format: int64
          description: "Tutar, kuruş cinsinden"
          example: 12550
        currency:
          type: string
          description: ISO 4217 para birimi kodu
          example: TRY
      required:
      - amount
      - currency
    ProductPhotoView:
      type: object
      description: "İlan fotoğrafı; anahtarlar GET /api/v1/product-photos/{key} ile\
        \ sunulur"
      properties:
        id:
          type: integer
          format: int64
          description: Fotoğrafın kimliği
          example: 15
        cardKey:
          type: string
          description: Kart boyutunun anahtarı (uzun kenar 400 px)
          example: 3f9a1c0b7d2e4f6a8b1c2d3e4f5a6b7c
        largeKey:
          type: string
          description: Büyük boyutun anahtarı (uzun kenar 1600 px)
          example: 8b1c2d3e4f5a6b7c3f9a1c0b7d2e4f6a
        width:
          type: integer
          format: int32
          description: Büyük boyutun genişliği (px)
          example: 1600
        height:
          type: integer
          format: int32
          description: Büyük boyutun yüksekliği (px)
          example: 1200
      required:
      - cardKey
      - height
      - id
      - largeKey
      - width
    SellerListingView:
      type: object
      description: Satıcının kendi ilanı
      properties:
        id:
          type: integer
          format: int64
          description: İlanın kimliği
          example: 42
        slug:
          type: string
          description: Vitrin adresindeki kalıcı ad
          example: salkim-domates
        name:
          type: string
          description: İlan adı
          example: Salkım Domates
        description:
          type:
          - string
          - "null"
          description: Açıklama
          example: "Tarla domatesi, sabah toplandı."
        unit:
          type: string
          description: Satış birimi
          enum:
          - KILOGRAM
          - PIECE
          - BUNCH
          example: KILOGRAM
        unitPrice:
          $ref: "#/components/schemas/Money"
          description: Birim fiyat
        stockQuantity:
          type: integer
          format: int32
          description: Eldeki miktar
          example: 80
        status:
          type: string
          description: İlanın durumu
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
          - REMOVED
          example: DRAFT
        statusReason:
          type:
          - string
          - "null"
          description: Admin kaldırma gerekçesi; yalnızca REMOVED durumunda
          example: Fotoğraflar ürünü göstermiyor.
        publishedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "İlk yayın anı (UTC, ISO-8601); hiç yayınlanmadıysa boş"
          example: 2026-10-08T09:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: "Son değişiklik anı (UTC, ISO-8601)"
          example: 2026-10-08T09:30:00Z
        photos:
          type: array
          description: "Fotoğraflar, sırayla; ilki kapak"
          items:
            $ref: "#/components/schemas/ProductPhotoView"
      required:
      - id
      - name
      - photos
      - slug
      - status
      - stockQuantity
      - unit
      - unitPrice
      - updatedAt
    PhotoOrderRequest:
      type: object
      description: Fotoğrafların yeni sırası; ilk eleman kapak
      properties:
        photoIds:
          type: array
          description: "İlanın bütün fotoğraf kimlikleri, yeni sırayla"
          items:
            type: integer
            format: int64
            description: Fotoğraf kimliği
            example: 15
          maxItems: 5
          minItems: 1
      required:
      - photoIds
    LoginRequest:
      type: object
      description: Oturum açma isteği
      properties:
        email:
          type: string
          description: E-posta adresi
          example: alici@ornek.test
          maxLength: 320
          minLength: 0
        password:
          type: string
          description: Parola
          example: cok-gizli-parola
          maxLength: 200
          minLength: 0
      required:
      - email
      - password
    SessionTokens:
      type: object
      description: Açılan oturumun erişim ve yenileme token'ları
      properties:
        accessToken:
          type: string
          description: "JWT erişim token'ı; `Authorization: Bearer` başlığında gö\
            nderilir, 15 dakika geçerlidir"
          example: eyJhbGciOiJIUzI1NiJ9.ornek.imza
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: Erişim token'ının bitiş anı (UTC)
          example: 2026-10-07T12:15:00Z
        refreshToken:
          type: string
          description: Opak yenileme token'ı; tek kullanımlıktır
          example: q3Jx0ornekYenilemeTokeni9Zt
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Yenileme token'ının bitiş anı (UTC)
          example: 2026-11-06T12:00:00Z
      required:
      - accessToken
      - accessTokenExpiresAt
      - refreshToken
      - refreshTokenExpiresAt
    LoginChallengeIssued:
      type: object
      description: "İkinci adım bekleniyor: e-postayla kod gönderildi"
      properties:
        message:
          type: string
          description: Kullanıcıya gösterilebilir bilgilendirme; isteğin diliyle (Accept-Language)
            döner
          example: E-posta adresinize bir giriş kodu gönderdik.
        expiresAt:
          type: string
          format: date-time
          description: Kodun bitiş anı (UTC)
          example: 2026-10-07T12:10:00Z
      required:
      - expiresAt
      - message
    RefreshTokenRequest:
      type: object
      description: Yenileme token'ı
      properties:
        refreshToken:
          type: string
          description: Opak yenileme token'ı
          example: q3Jx0ornekYenilemeTokeni9Zt
          maxLength: 200
          minLength: 0
      required:
      - refreshToken
    ChallengeRequest:
      type: object
      description: İkinci faktör kodu
      properties:
        email:
          type: string
          description: Birinci adımda kullanılan e-posta adresi
          example: alici@ornek.test
          maxLength: 320
          minLength: 0
        code:
          type: string
          description: E-postadaki altı haneli kod
          example: "042917"
          minLength: 1
          pattern: "\\d{6}"
      required:
      - code
      - email
    PhotoUploadRequest:
      type: object
      description: İlana tek fotoğraf yükleme
      properties:
        photo:
          type: string
          format: binary
          description: "Fotoğraf: JPEG veya PNG; en çok 10 MB ve 40 megapiksel"
      required:
      - photo
    SellerDecisionReason:
      type: object
      description: Ret veya askı gerekçesi; satıcıya gösterilir
      properties:
        reason:
          type: string
          description: Satıcıya gösterilecek gerekçe
          example: Belgedeki ad ile beyan edilen ad eşleşmiyor.
          maxLength: 500
          minLength: 10
      required:
      - reason
    AdminSellerDetail:
      type: object
      description: Admin için satıcı kaydı ayrıntısı ve geçmişi
      properties:
        id:
          type: integer
          format: int64
          description: Satıcı kaydının kimliği
          example: 42
        slug:
          type: string
          description: Vitrin adresindeki kalıcı ad
          example: ornek-bahce
        displayName:
          type: string
          description: Üretici adı
          example: Örnek Bahçe
        city:
          type: string
          description: Şehir
          example: Manisa
        phone:
          type:
          - string
          - "null"
          description: "İletişim telefonu, E.164; seed kayıtlarında boş"
          example: "+905550000000"
        accountEmail:
          type:
          - string
          - "null"
          description: Kaydın sahibi olan hesabın e-postası; seed kayıtlarında boş
          example: uretici@ornek.test
        status:
          type: string
          description: Kaydın durumu
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
          example: PENDING
        statusReason:
          type:
          - string
          - "null"
          description: Son ret veya askı gerekçesi
          example: Belgedeki ad okunmuyor.
        documentType:
          type:
          - string
          - "null"
          description: Güncel belgenin türü; belgesiz seed kayıtlarında boş
          enum:
          - CKS_CERTIFICATE
          - TAX_CERTIFICATE
          example: CKS_CERTIFICATE
        createdAt:
          type: string
          format: date-time
          description: "Başvurunun ilk yapıldığı an (UTC, ISO-8601)"
          example: 2026-10-08T09:30:00Z
        statusChangedAt:
          type:
          - string
          - "null"
          format: date-time
          description: "Durumun son değiştiği an (UTC, ISO-8601); seed kayıtlarında\
            \ boş olabilir"
          example: 2026-10-08T09:30:00Z
        history:
          type: array
          description: "Durum geçişleri, eskiden yeniye"
          items:
            $ref: "#/components/schemas/SellerStatusChangeView"
      required:
      - city
      - createdAt
      - displayName
      - history
      - id
      - slug
      - status
      - statusChangedAt
    SellerStatusChangeView:
      type: object
      description: Satıcı kaydının bir durum geçişi
      properties:
        fromStatus:
          type:
          - string
          - "null"
          description: Önceki durum; başvuruda boş
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
          example: PENDING
        toStatus:
          type: string
          description: Yeni durum
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
          example: REJECTED
        reason:
          type:
          - string
          - "null"
          description: Gerekçe; ret ve askıda dolu
          example: Belgedeki ad okunmuyor.
        actorEmail:
          type: string
          description: Geçişi yapan hesabın e-postası
          example: admin@ornek.test
        createdAt:
          type: string
          format: date-time
          description: "Geçişin anı (UTC, ISO-8601)"
          example: 2026-10-08T10:15:00Z
      required:
      - actorEmail
      - createdAt
      - toStatus
    ListingRemovalRequest:
      type: object
      description: İlan kaldırma gerekçesi; satıcıya gösterilir
      properties:
        reason:
          type: string
          description: Satıcıya gösterilecek gerekçe
          example: Fotoğraflar ilandaki ürünü göstermiyor.
          maxLength: 500
          minLength: 10
      required:
