openapi: 3.1.0
info:
  title: Bahçeden API
  description: "Bahçeden, meyve-sebze üreticisini son tüketiciyle doğrudan buluşturan\
    \ çok satıcılı pazaryeridir. Bu sözleşme `api` ile `web` arasındaki tek arayü\
    zdür ve Spring kodundan üretilir; elle düzenlenmez."
  version: v1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Sağlık
  description: Operasyonel sağlık kontrolü
- name: Satıcı ödeme hesabı
  description: Onaylı satıcının ödeme bilgileri ve alt üye işyeri kaydı
- name: Adresler
  description: Oturum sahibinin teslimat adresleri
- name: Satıcı ilanları
  description: Onaylı satıcının kendi ürün ilanları
- name: Satıcı başvurusu
  description: Oturum sahibinin satıcı başvurusu ve kaydı
- name: "Admin: ilanlar"
  description: "İlanların listelenmesi, kaldırılması ve yeniden açılması"
- name: "Admin: satıcılar"
  description: Satıcı başvurularının listelenmesi ve karara bağlanması
- name: Teslimat
  description: Teslimat yapılan iller
- name: Oturum
  description: "Oturum açma, yenileme ve kapatma"
- name: Siparişler
  description: "Sepetten sipariş, ödeme ve alıcının siparişleri"
- name: Satıcı siparişleri
  description: Onaylı satıcının gelen siparişleri
- name: "Admin: siparişler"
  description: Teslim edilemeyen satıcı siparişleri ve karar
- name: Ürünler
  description: Vitrindeki ürünlerin listelenmesi
- name: Satıcı gönderileri
  description: Kargoya hazırla ve etiket
- name: Sepet
  description: "Oturum sahibinin sepeti, satıcılara göre gruplu"
- name: Hesap
  description: "Hesap açma, e-posta doğrulama, parola sıfırlama ve oturum sahibinin\
    \ kimliği"
paths:
  /api/v1/sellers/me:
    get:
      tags:
      - Satıcı başvurusu
      summary: Oturum sahibinin satıcı kaydını döner
      description: Kayıt yoksa 404 döner; arayüz bunu başvuruya davet olarak gösterir.
      operationId: getOwnSeller
      responses:
        "200":
          description: Satıcı kaydı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSelfView"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Hesabın satıcı kaydı yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    put:
      tags:
      - Satıcı başvurusu
      summary: Reddedilen başvuruyu yeniden gönderir
      description: |
        Yalnızca REJECTED durumundaki kayıt için: beyan güncellenir, yeni belge eklenir ve
        kayıt yeniden PENDING olur. Önceki belge denetim izi için saklanır.
      operationId: resubmitSellerApplication
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SellerApplicationRequest"
      responses:
        "200":
          description: Başvuru yeniden gönderildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSelfView"
        "400":
          description: Alan veya belge geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Hesabın satıcı kaydı yok (SELLER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Kayıt reddedilmiş durumda değil (SELLER_INVALID_TRANSITION)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    post:
      tags:
      - Satıcı başvurusu
      summary: Satıcı başvurusu yapar
      description: |
        Beyan alanları ve belge dosyası tek istekte gönderilir. Kayıt PENDING açılır ve
        admin kararı e-postayla bildirilir. E-posta adresi doğrulanmış olmalıdır. Belge
        türü içerikten doğrulanır: PDF, JPEG veya PNG; en çok 10 MB.
      operationId: applyAsSeller
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SellerApplicationRequest"
      responses:
        "201":
          description: Başvuru alındı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSelfView"
        "400":
          description: Alan veya belge geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Hesabın zaten satıcı kaydı var (SELLER_ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: E-posta doğrulanmamış (SELLER_EMAIL_NOT_VERIFIED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}:
    get:
      tags:
      - Satıcı ilanları
      summary: Satıcının tek ilanını döner
      operationId: getOwnListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    put:
      tags:
      - Satıcı ilanları
      summary: İlanın bilgilerini günceller
      description: Durum ve kalıcı ad değişmez. Yayındaki ilanın değişikliği vitrinde
        hemen görünür.
      operationId: updateListing
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
        required: true
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/products/{id}/photos/order:
    put:
      tags:
      - Satıcı ilanları
      summary: Fotoğrafların sırasını değiştirir
      description: Liste ilanın bütün fotoğraflarını eksiksiz ve tekrarsız içermelidir;
        ilk eleman kapak olur.
      operationId: reorderListingPhotos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoOrderRequest"
        required: true
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: İlan yok veya başkasına ait (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sellers/me/payout-account:
    get:
      tags:
      - Satıcı ödeme hesabı
      summary: Satıcının ödeme hesabını döner
      description: IBAN ve kimlik numarası maskelidir. Hesap yoksa 404 döner.
      operationId: getOwnPayoutAccount
      responses:
        "404":
          description: Ödeme hesabı yok (PAYOUT_ACCOUNT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Ödeme hesabı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutAccountView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    put:
      tags:
      - Satıcı ödeme hesabı
      summary: Ödeme bilgilerini kaydeder veya günceller
      description: |
        Kimlik numarası ve IBAN sağlamalarıyla doğrulanır; kayıt aynı istekte ödeme sağlayıcısında alt üye
        işyeri olarak açılır veya güncellenir. Sağlayıcı reddederse bilgiler saklanır, hesap
        PROVIDER_REJECTED olur ve 422 döner.
      operationId: savePayoutAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutAccountRequest"
        required: true
      responses:
        "422":
          description: Ödeme sağlayıcısı kaydı reddetti (PAYOUT_ACCOUNT_REJECTED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Ödeme sağlayıcısına ulaşılamadı (PAYMENT_PROVIDER_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Ödeme hesabı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutAccountView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/cart/items/{productId}:
    put:
      tags:
      - Sepet
      summary: Ürünü sepete ekler veya adedini değiştirir
      description: |
        Adet 1–99 ve stoğu aşamaz. Satın alınamayan ürün ve satıcının kendi ürünü eklenemez; sepette en çok 50
        farklı ürün olur.
      operationId: setCartItem
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemRequest"
        required: true
      responses:
        "200":
          description: Güncel sepet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
        "400":
          description: Adet geçersiz veya stoğu aşıyor (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Ürün yok (PRODUCT_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: |-
            Ürün satın alınamaz (PRODUCT_NOT_PURCHASABLE), satıcının kendi ürünü (CANNOT_BUY_OWN_PRODUCT) veya sepet dolu
            (CART_FULL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Sepet
      summary: Ürünü sepetten çıkarır
      description: Satır yoksa sepet olduğu gibi döner.
      operationId: removeCartItem
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Güncel sepet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartView"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/addresses/{id}:
    put:
      tags:
      - Adresler
      summary: Adresi günceller
      description: Geçmiş siparişler etkilenmez; sipariş adresin kopyasını taşır.
      operationId: updateAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
        required: true
      responses:
        "404":
          description: Adres yok veya başkasına ait (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Adres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddressView"
        "400":
          description: Alan geçersiz veya il teslimat listesinde yok (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Adresler
      summary: Adresi siler
      description: Geçmiş siparişler etkilenmez.
      operationId: deleteAddress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Adres silindi
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Adres yok veya başkasına ait (ADDRESS_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
      - bearerAuth: []
  /api/v1/sessions:
    post:
      tags:
      - Oturum
      summary: Oturum açar
      description: |
        E-posta ve parola ile oturum açar. E-posta doğrulaması girişin koşulu
        değildir. Hesabın ikinci faktörü kapalıysa (varsayılan) token'lar döner;
        açıksa token dönmez ve e-postaya tek kullanımlık bir kod gönderilir.
        Hatalı e-posta ile hatalı parola aynı yanıtı alır.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "202":
          description: İkinci adım bekleniyor; kod e-postayla gönderildi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginChallengeIssued"
        "400":
          description: İstek gövdesi geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: E-posta veya parola hatalı (AUTH_INVALID_CREDENTIALS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla deneme (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sessions/refresh:
    post:
      tags:
      - Oturum
      summary: Oturumu yeniler
      description: |
        Yenileme token'ını tüketir; yeni bir erişim token'ı ve yeni bir yenileme
        token'ı döner. Sunulan token bir daha kullanılamaz. Kullanılmış bir token
        yeniden sunulursa oturum zincirinin tamamı iptal edilir.
      operationId: refreshSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: Oturum yenilendi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          description: "Token eksik (VALIDATION_FAILED) ya da geçersiz, kullanılmı\
            ş, iptal edilmiş veya süresi dolmuş (AUTH_TOKEN_INVALID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sessions/challenge:
    post:
      tags:
      - Oturum
      summary: İkinci faktör koduyla oturum açar
      description: |
        Girişin birinci adımı 202 döndüyse e-postaya gelen altı haneli kod burada
        sunulur. Yalnızca son gönderilen kod geçerlidir; kod 10 dakika geçerlidir
        ve bir kez kullanılabilir. Beş hatalı denemeden sonra girişim kilitlenir.
      operationId: completeLoginChallenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
        required: true
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
        "400":
          description: İstek gövdesi geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: "Kod hatalı, kullanılmış, süresi dolmuş ya da açık girişim\
            \ yok (AUTH_CODE_INVALID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla hatalı deneme (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sellers/me/products:
    get:
      tags:
      - Satıcı ilanları
      summary: Satıcının ilanlarını listeler
      description: En son güncellenen üstte. Sayfa boyutunun üst sınırı sunucuda 50'dir.
      operationId: listOwnListings
      parameters:
      - name: page
        in: query
        description: Sayfa numarası (sıfırdan başlar)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Sayfa boyutu; üst sınır sunucuda 50'ye çekilir
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          minimum: 1
        example: 20
      responses:
        "200":
          description: İlan veya ilanlar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseSellerListingView"
        "400":
          description: Alan geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Oturum yok (AUTH_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Satıcı rolü yok (AUTH_FORBIDDEN) veya satıcı kaydı onaylı değil
            (SELLER_NOT_APPROVED)
          content:
            application/json:
              schema:
