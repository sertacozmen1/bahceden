  /api/v1/accounts:
    post:
      tags:
      - Hesap
      summary: Hesap açar
      description: |
        Hesap doğrudan etkin açılır ve e-posta adresine bir doğrulama bağlantısı
        gönderilir; doğrulama girişi engellemez. Yanıt, e-posta adresinin sistemde
        kayıtlı olup olmadığını açığa çıkarmaz: her durumda aynı gövde döner.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          description: İstek alındı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationAccepted"
        "400":
          description: E-posta veya parola geçersiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/accounts/verifications:
    post:
      tags:
      - Hesap
      summary: E-posta adresini doğrular
      description: |
        E-postadaki bağlantının token'ını tüketir ve hesabı doğrulanmış işaretler.
        Token tek kullanımlıktır ve 24 saat geçerlidir. Doğrulama girişin koşulu
        değildir; yalnızca hesabın bilgisini günceller.
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: E-posta doğrulandı
        "400":
          description: "Token eksik (VALIDATION_FAILED) ya da geçersiz, kullanılmı\
            ş veya süresi dolmuş (AUTH_TOKEN_INVALID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/accounts/password-resets:
    post:
      tags:
      - Hesap
      summary: Parola sıfırlama bağlantısı gönderir
      description: |
        Adres kayıtlı bir hesaba aitse hesabın dilinde, 1 saat geçerli ve tek
        kullanımlık bir sıfırlama bağlantısı gönderir; önceki bağlantılar geçersiz
        olur. Yanıt, adresin kayıtlı olup olmadığını açığa çıkarmaz: her durumda
        aynı gövde döner. Kayıtsız adrese e-posta gönderilmez.
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "202":
          description: İstek alındı
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequested"
        "400":
          description: E-posta geçersiz (VALIDATION_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/accounts/password-resets/confirmations:
    post:
      tags:
      - Hesap
      summary: Sıfırlama bağlantısıyla yeni parola belirler
      description: |
        Sıfırlama token'ını tüketir ve parolayı değiştirir. Hesabın bütün oturumları
        ve açık giriş kodları kapanır, e-posta doğrulanmış işaretlenir ve parolanın
        değiştiği hesabın e-posta adresine bildirilir. Oturum açılmaz: kullanıcı
        yeni parolasıyla giriş yapar.
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmation"
        required: true
      responses:
        "204":
          description: Parola değişti
        "400":
          description: "Token veya parola geçersiz (VALIDATION_FAILED) ya da token\
            \ geçersiz, kullanılmış veya süresi dolmuş (AUTH_TOKEN_INVALID)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Çok fazla istek (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/accounts/me/verification-requests:
    post:
      tags:
      - Hesap
      summary: Yeni doğrulama bağlantısı gönderir
      description: |
        Oturum sahibinin kayıtlı e-posta adresine yeni bir doğrulama bağlantısı
        gönderir. Adres istekten alınmaz. E-posta zaten doğrulanmışsa bir şey
        gönderilmez; yanıt yine aynıdır.
      operationId: requestVerificationLink
      responses:
