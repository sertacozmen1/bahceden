      - name: page
        in: query
        description: Sayfa numarası (sıfırdan başlar)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
        example: 0
      - name: size
        in: query
        description: Sayfa boyutu; üst sınır sunucuda 50'ye çekilir
        required: false
        schema:
