site_name: Bahçeden Documentation
site_description: Bahçeden Teknik Dokümantasyon Portalı (Local)
docs_dir: '..'
# site_dir, docs_dir ('..') içinde olamaz: mkdocs build dizinini kendi içine
# kopyalar. Çıktı depo köküne alınır ('site/' .gitignore'da olmalıdır).
site_dir: '../../site'

theme:
  name: material
  language: tr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Karanlık moda geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Aydınlık moda geç
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: tr
  - mermaid2
  - git-revision-date-localized:
      type: timeago
      fallback_to_build_date: true
      # Yeniden adlandırılan dosyalarda "ilk revizyon son revizyondan eski"
      # uyarısı strict derlemeyi kırıyor; follow davranışı kapatıldı.
      enable_git_follow: false
      # Oluşturma tarihi kapalı: henüz commit'lenmemiş bir sayfa için eklenti
      # tutarsız tarih üretip strict derlemeyi kırıyordu. Bu, her yeni doküman
      # dosyasında pre-commit hook'unu bloke eden tekrarlayan bir sürtünmeydi.
      # Son güncelleme tarihi gösterilmeye devam ediyor.
      enable_creation_date: false
  - minify:
      minify_html: true

# Şablonlar portalda görünmez: kopyalanmak için vardır, okunmak için değil.
# .tools/ portalın kendi araçları (venv dahil): site çıktısına girmez ve
# git-revision eklentisinin gürültüsünü kesmek için açıkça dışlanır.
exclude_docs: |
  */template.md
  .tools/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.critic
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Ana Sayfa: README.md
  - Referans:
    - Güncel Durum ve Sınırlamalar: reference/00-current-state.md
    - Domain Modeli ve Şema: reference/01-domain-model.md
    - API Referansı: reference/02-api-reference.md
  - ADR:
    - Genel Bakış: adr/index.md
    - "ADR-001 · Spring API + Next.js web": adr/001-spring-api-and-next-web.md
    - "ADR-002 · Bağımlılık bütçesi": adr/002-dependency-budget.md
    - "ADR-003 · Tek sözleşme: OpenAPI": adr/003-openapi-as-single-contract.md
    - "ADR-004 · PostgreSQL + Flyway (superseded)": adr/004-postgresql-with-flyway.md
    - "ADR-005 · Test stratejisi": adr/005-test-strategy.md
    - "ADR-006 · Para minor unit": adr/006-money-as-minor-unit.md
    - "ADR-007 · Satıcı veri izolasyonu": adr/007-query-level-ownership-scoping.md
    - "ADR-008 · Kimlik: JWT + iptal edilebilir yenileme": adr/008-jwt-auth-with-opaque-refresh.md
    - "ADR-009 · Sözleşme Spring'den üretilir": adr/009-contract-generated-from-spring.md
    - "ADR-010 · Ürün durumu enum": adr/010-product-status-as-enum.md
    - "ADR-011 · Fetch join + sorgu sayısı testi": adr/011-fetch-join-with-query-count-test.md
    - "ADR-012 · Sayfa boyutu sınırı": adr/012-page-size-capped-on-server.md
    - "ADR-013 · Minimum sellers tablosu": adr/013-minimal-seller-table-ahead-of-onboarding.md
    - "ADR-014 · Dev seed": adr/014-dev-seed-via-profiled-repeatable-migration.md
    - "ADR-015 · Sözleşme tazelik testi": adr/015-contract-freshness-enforced-by-test.md
    - "ADR-016 · Liquibase ile şema takibi": adr/016-liquibase-for-schema-migrations.md
  - Nasıl Yapılır (How-to):
    - Genel Bakış: how-to/index.md
    - Yerel Geliştirme Ortamı: how-to/yerel-gelistirme.md
    - Yeni API Ucu Ekleme: how-to/yeni-api-ucu-ekleme.md
  - Ürün & Strateji: product/index.md
  - Araştırma (Research): research/index.md
  - Eğitimler (Tutorials): tutorials/index.md
  - Açıklamalar (Explanation): explanation/index.md
  - Feature Kayıtları:
    - Genel Bakış: features/index.md
    - Vitrin ve Arama: features/vitrin-ve-arama.md
    - "Genel (feature dışı işler)": features/_genel.md

copyright: Bahçeden Internal Documentation
