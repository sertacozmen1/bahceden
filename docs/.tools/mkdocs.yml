site_name: Bahçeden Documentation
site_description: Bahçeden Teknik Dokümantasyon Portalı (Local)
docs_dir: '..'
# site_dir, docs_dir ('..') içinde olamaz: mkdocs build dizinini kendi içine
# kopyalar. Çıktı depo köküne alınır ('site/' .gitignore'da olmalıdır).
site_dir: '../../site'

theme:
  name: material
  language: tr
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Karanlık moda geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Aydınlık moda geç
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang: tr
  - mermaid2
  - git-revision-date-localized:
      type: timeago
      fallback_to_build_date: true
      # Yeniden adlandırılan dosyalarda "ilk revizyon son revizyondan eski"
      # uyarısı strict derlemeyi kırıyor; follow davranışı kapatıldı.
      enable_git_follow: false
      # Oluşturma tarihi kapalı: henüz commit'lenmemiş bir sayfa için eklenti
      # tutarsız tarih üretip strict derlemeyi kırıyordu. Bu, her yeni doküman
      # dosyasında pre-commit hook'unu bloke eden tekrarlayan bir sürtünmeydi.
      # Son güncelleme tarihi gösterilmeye devam ediyor.
      enable_creation_date: false
  - minify:
      minify_html: true

# Şablonlar portalda görünmez: kopyalanmak için vardır, okunmak için değil.
# .tools/ portalın kendi araçları (venv dahil): site çıktısına girmez ve
# git-revision eklentisinin gürültüsünü kesmek için açıkça dışlanır.
exclude_docs: |
  */template.md
  .tools/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.critic
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

