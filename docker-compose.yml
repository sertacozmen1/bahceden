# Bahçeden: geliştirme ortamı.
#
# Buradaki kimlik bilgileri yalnızca YEREL GELİŞTİRME içindir ve bilinçli olarak
# depoya girer: üretimde bu değerler ortamdan / secret yöneticisinden gelir ve
# asla commit'lenmez (AGENTS.md K10). Gerçek müşteri verisi bu ortama konmaz.
#
# Servisler:
#   db       PostgreSQL 17  (ADR-004)
#   api      Spring Boot 3  (ADR-001) http://localhost:8080
#   mailpit  e-posta yakalayıcı       http://localhost:8025
#   redis    Redis 7.2 (ADR-107)      localhost:6379; hız sınırı + vitrin cache'i, kalıcılık kapalı
#   kafka    Apache Kafka 3.9 (ADR-107) localhost:9094; KRaft tek düğüm, iş olayları
#
# web servisi (Next.js) dilimin 4. fazında eklenir; o faza kadar bu dosya
# tek başına çalışır durumdadır (AGENTS.md K5).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bahceden
      POSTGRES_USER: bahceden
      POSTGRES_PASSWORD: bahceden-dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bahceden -d bahceden"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      BAHCEDEN_DB_URL: jdbc:postgresql://db:5432/bahceden
      BAHCEDEN_DB_USERNAME: bahceden
      BAHCEDEN_DB_PASSWORD: bahceden-dev
      BAHCEDEN_WEB_ORIGIN: http://localhost:3000
      # E-posta mailpit'e gider; gerçek gönderim yapılmaz (AGENTS.md K10).
      BAHCEDEN_SMTP_HOST: mailpit
      BAHCEDEN_SMTP_PORT: 1025
      BAHCEDEN_MAIL_FROM: bahceden@ornek.test
      # Yalnızca yerel geliştirme imza anahtarı; üretimde secret yöneticisinden gelir.
      BAHCEDEN_JWT_SECRET: YmFoY2VkZW4teWVyZWwtZ2VsaXN0aXJtZS1pbXphLWFuYWh0YXJpLWdpemxpLWRlZ2ls
      # Yüklenen dosyalar (satıcı belgeleri) volume'da durur (ADR-039); konteyner
      # yeniden kurulduğunda kaybolmaz. Yedeklemesi barındırma kararına bağlı (B5).
      BAHCEDEN_STORAGE_DIR: /app/uploads
      # Redis ve Kafka konteyner ağı içinde servis adıyla çözülür (ADR-107).
      BAHCEDEN_REDIS_URL: redis://redis:6379
      BAHCEDEN_KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      # Bağlam depo köküdür: imaj sözleşmeyi (shared/contracts) okuyup tipleri
      # kendi üretir, çünkü üretilen tipler commit'lenmez (ADR-009).
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Konteyner ağı içinde api servis adıyla çözülür; bu değer yalnızca
      # sunucu tarafında okunur, tarayıcıya gönderilmez (AGENTS.md §12.3).
      BAHCEDEN_API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

  redis:
    image: redis:7.2-alpine
    # Cache ve hız sınırı sayaçları geçicidir: diske yazılmaz. Kaybolurlarsa
    # cache yeniden dolar, sayaç pencere başından sayar (ADR-107).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    # KRaft tek düğüm: aynı süreç hem broker hem controller; ZooKeeper yok.
    # İki dinleyici: konteyner ağı (kafka:9092, api buradan bağlanır) ve
    # makineden erişim (localhost:9094, olayları izlemek için).
    # Veri volume'a yazılmaz: olayın doğruluk kaynağı outbox tablosudur (ADR-110).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topic'leri uygulama açılışta tanımlar; yazım hatasıyla topic doğmaz.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  db-data:
  uploads:
